<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover 兼容安全区；maximum-scale=1 防缩放（保持输入体验） -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0072e3">
  <meta name="description" content="宽带线索商机——一线师傅专用的商机收集与统计工具">
  <title>宽带线索商机</title>
  <!-- PWA 应用清单与图标 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="商机">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div id="app">
    <div id="banner-container"></div>
    <div id="page-container"></div>
    <nav id="tabbar">
      <button class="tab-item" data-route="home">
        <span class="tab-icon">🏠</span>
        <span>商机</span>
      </button>
      <button class="tab-item" data-route="input">
        <span class="tab-add">+</span>
        <span>录入</span>
      </button>
      <button class="tab-item" data-route="stats">
        <span class="tab-icon">📊</span>
        <span>统计</span>
      </button>
      <button class="tab-item" data-route="mine">
        <span class="tab-icon">👤</span>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <!-- 高德配置（独立文件，可替换） -->
  <script src="config/amap-key.js"></script>

  <!-- 核心库 -->
  <script src="js/utils/time.js"></script>
  <script src="js/utils/validate.js"></script>
  <script src="js/utils/ui.js"></script>
  <script src="js/utils/lead-builder.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/utils/amap.js"></script>
  <script src="js/utils/export.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/detail.js"></script>
  <script src="js/pages/input.js"></script>
  <script src="js/pages/stats.js"></script>
  <script src="js/pages/mine.js"></script>
  <script src="js/pages/share.js"></script>
  <script src="js/pages/guide.js"></script>
  <script src="js/app.js"></script>
  <!-- PWA Service Worker 注册（仅 https 或 localhost 生效，静默失败不影响页面） -->
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {
          /* 忽略：不支持或非 https 环境不影响使用 */
        });
      });
    }
  </script>
</body>
</html>
